<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>포토 클리너 - 핸드폰 사진첩 용량 다이어트 & 폴더 정리 앱</title>
  <meta name="description" content="핸드폰 저장 공간을 절약하고 사진첩을 깔끔하게 폴더로 정리하는 스마트 포토 클리너. 다중 선택, 중복 사진 감지, 대용량 압축 기능 제공.">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <!-- Pretendard Variable Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=3">

  <!-- External CDN Libraries (JSZip & QRCode) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <!-- Ambient Background Atmosphere -->
  <div class="ambient-glow"></div>

  <!-- App Sticky Header -->
  <header class="app-header">
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m14 12-8.5 8.5a2.12 2.12 0 1 1-3-3L11 9"/>
          <path d="M16 16 8 8"/>
          <path d="m18 10 2-2a3 3 0 0 0-4.24-4.24l-2 2"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>포토 클리너</h1>
        <span>스마트 사진첩 정리기</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="btnConnectPhone" title="핸드폰으로 접속하기">
        <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        <span>폰 연결</span>
      </button>
      <button class="btn btn-secondary" id="btnToggleSelect">
        선택
      </button>
    </div>
  </header>

  <!-- Storage Overview Card -->
  <section class="storage-hero">
    <div class="storage-stats-header">
      <div>
        <div class="storage-title">내 기기 저장 공간 점유율</div>
        <div class="storage-number" id="storageTotalNumber">0 MB <small id="storageTotalCount">(0장의 사진)</small></div>
      </div>
      <div class="savings-badge" id="storageSavingsBadge">
        <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="storageSavingsCount">0 B 절약 가능</span>
      </div>
    </div>

    <div class="storage-bar-track">
      <div class="storage-bar-fill fill-photos" id="fillPhotos" style="width: 0%;"></div>
      <div class="storage-bar-fill fill-organized" id="fillOrganized" style="width: 0%;"></div>
      <div class="storage-bar-fill fill-trash" id="fillTrash" style="width: 0%;"></div>
    </div>

    <div class="storage-legend">
      <div class="legend-item"><span class="legend-dot" style="background:#6366f1;"></span>미분류 사진</div>
      <div class="legend-item"><span class="legend-dot" style="background:#10b981;"></span>폴더 정리됨</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span>휴지통</div>
    </div>
  </section>

  <!-- Quick Action Toolbar -->
  <section class="toolbar-section">
    <div class="action-row">
      <div class="file-input-wrapper">
        <input type="file" id="fileInput" multiple accept="image/*" />
        <button class="btn btn-import">
          <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          사진첩에서 사진 추가하기
        </button>
      </div>
      <button class="btn btn-secondary" id="btnLoadSamples" style="white-space: nowrap; font-size: 0.82rem; padding: 12px 14px;">
        데모 사진 생성
      </button>
    </div>
  </section>

  <!-- Folder Filter Tabs Carousel -->
  <section class="folder-tabs-wrapper" id="folderTabsWrapper">
    <div class="folder-tabs-scroll" id="folderTabsScroll">
      <!-- Folder tabs will be injected by app.js -->
    </div>
  </section>

  <!-- Gallery Control & Count Bar -->
  <section class="gallery-control-bar" id="galleryControlBar">
    <div class="gallery-title-wrapper">
      <span class="gallery-section-title">사진 보관함</span>
      <span class="gallery-count-badge" id="galleryCountBadge">0장</span>
    </div>
  </section>

  <!-- Main Dynamic Content Area (Photo Grid, Folder View, Smart Diet, Trash) -->
  <main id="mainContentArea" class="photo-grid-container">
    <!-- Rendered dynamically -->
  </main>

  <!-- Floating Action Bar for Multi-Selection -->
  <div class="floating-action-bar" id="floatingActionBar">
    <div class="fab-info-row">
      <div class="fab-selected-text">
        <span class="badge-count" id="fabSelectedCount">0장</span>
        <span>선택됨</span>
        <span style="color:var(--text-secondary);font-size:0.8rem;" id="fabSelectedSize">(0 MB)</span>
      </div>
      <button class="fab-select-all-btn" id="fabSelectAll">전체 선택/해제</button>
    </div>
    <div class="fab-actions-grid">
      <button class="fab-action-btn btn-action-move" id="fabMoveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        <span>폴더 이동</span>
      </button>
      <button class="fab-action-btn btn-action-compress" id="fabCompressBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14h6m0 0v6m0-6L3 21"/><path d="M20 10h-6m0 0V4m0 6 7-7"/></svg>
        <span>용량 줄이기</span>
      </button>
      <button class="fab-action-btn btn-action-download" id="fabDownloadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>ZIP 저장</span>
      </button>
      <button class="fab-action-btn btn-action-delete" id="fabDeleteBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        <span>삭제</span>
      </button>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-tab-item active" data-tab="photos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      <span>사진</span>
    </button>
    <button class="nav-tab-item" data-tab="folders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
      <span>폴더</span>
    </button>
    <button class="nav-tab-item" data-tab="smart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14 12-8.5 8.5a2.12 2.12 0 1 1-3-3L11 9"/><path d="M16 16 8 8"/><path d="m18 10 2-2a3 3 0 0 0-4.24-4.24l-2 2"/></svg>
      <span>다이어트</span>
    </button>
    <button class="nav-tab-item" data-tab="trash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      <span>휴지통</span>
    </button>
  </nav>

  <!-- Generic Bottom Sheet Modal -->
  <div class="modal-overlay" id="sheetOverlay">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3 class="sheet-title" id="sheetTitle">제목</h3>
        <button class="sheet-close-btn" id="sheetCloseBtn">
          <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Fullscreen Photo Viewer Modal -->
  <div class="modal-overlay viewer-modal" id="viewerModal">
    <div class="viewer-content">
      <div class="viewer-top-bar">
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="sheet-close-btn" id="viewerCloseBtn">
            <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <span style="font-weight:600;font-size:0.9rem;" id="viewerName">사진 상세</span>
        </div>
        <button class="btn btn-danger btn-icon" id="viewerDeleteBtn">
          <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
        </button>
      </div>

      <div class="viewer-image-wrap">
        <img id="viewerImg" src="" alt="확대 보기" />
      </div>

      <div class="viewer-bottom-bar">
        <div class="viewer-meta-text">
          <span id="viewerSize">0 MB</span> • <span id="viewerRes">0 × 0 px</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Connect Phone (QR Code) Modal -->
  <div class="modal-overlay" id="connectModal">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3 class="sheet-title">📱 핸드폰에서 열기</h3>
        <button class="sheet-close-btn" id="modalCloseBtn">
          <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="qr-modal-body">
        <p style="font-size:0.88rem;color:var(--text-secondary);">
          스마트폰 기본 카메라로 아래 QR 코드를 비추면<br/>
          핸드폰 사진첩을 직접 정리할 수 있습니다.
        </p>
        <div class="qr-box" id="qrcodeContainer"></div>
        <div class="qr-url-badge" id="connectUrlDisplay">http://localhost:8080</div>
        <div style="background:rgba(99,102,241,0.1);padding:12px;border-radius:var(--radius-md);font-size:0.8rem;color:#c7d2fe;text-align:left;">
          💡 <strong>팁:</strong> 모바일 브라우저(Safari / Chrome)에서 <strong>'홈 화면에 추가'</strong>를 누르면 일반 앱처럼 전체화면으로 편리하게 사용할 수 있습니다!
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js?v=3"></script>

  <!-- PWA Service Worker Registration with Force Update -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=3').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
